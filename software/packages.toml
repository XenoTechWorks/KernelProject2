[nethack.files]
# Debian's /usr/games/nethack is a /bin/sh script picked by update-alternatives; this is it for kpsh.
"usr/games/nethack" = """#!/bin/kpsh
export HACKDIR=/usr/lib/games/nethack
export NETHACKOPTIONS=/etc/nethack/nethackrc.console
cd /usr/lib/games/nethack
exec /usr/lib/games/nethack/nethack-console "$@"
"""
# The score and log files Debian's install script makes.
"var/games/nethack/record" = ""
"var/games/nethack/logfile" = ""
"var/games/nethack/xlogfile" = ""
"var/games/nethack/livelog" = ""
"var/games/nethack/perm" = ""
"var/games/nethack/save/.keep" = ""

