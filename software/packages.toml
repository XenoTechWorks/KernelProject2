# What Software offers. Each entry is built by software/build.py from Ubuntu 24.04's own packages
# (downloaded, never installed on the build machine) into a package of its own: the files, the
# libraries they need that KernelProject2 doesn't already have, and a little information.
#
#   debs      the Ubuntu packages whose files go in (the first one names the version)
#   only      if given, just these files from them (paths relative to /)
#   run       the command that starts it
#   terminal  runs inside a Terminal window (a text-mode program)
#   about     one line for the catalog
#   category  Games or Apps
#   files     extra files to add (path = contents), e.g. a launcher
#   icon      a picture for it: a file from the packages, or an Oxygen icon (rootfs/usr/share/icons)
#
# Everything here is free software (see each package's usr/share/doc/NAME/copyright).

[bastet]
title = "Bastet"
category = "Games"
debs = ["bastet"]
run = "/usr/games/bastet"
terminal = true
about = "Falling blocks, except the game picks the worst piece it can."
icon = "usr/share/icons/hicolor/96x96/apps/bastet.png"

