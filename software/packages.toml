# What Software offers. Each entry is built by software/build.py from Ubuntu 24.04's own packages
# (downloaded, never installed on the build machine) into a package of its own: the files, the
# libraries they need that KernelProject2 doesn't already have, and a little information.
#
#   debs      the Ubuntu packages whose files go in (the first one names the version)
#   only      if given, just these files from them (paths relative to /)
#   run       the command that starts it
#   terminal  runs inside a Terminal window (a text-mode program)
#   about     one line for the catalog
#   category  Games or Apps
#   files     extra files to add (path = contents), e.g. a launcher
#   depends   packages from here it needs (installed first; they come earlier in this file)
#   script    a build step of ours (software/...), run with the files in $TREE
#   tools     .debs only that step uses (headers, compilers): unpacked for it, not shipped
#   icon      a picture for it: a file from the packages, or an Oxygen icon (rootfs/usr/share/icons)
#
# Everything here is free software (see each package's usr/share/doc/NAME/copyright).

# OpenGL and Vulkan, drawn by the processor (there's no GPU driver): Mesa's OSMesa (llvmpipe) and
# lavapipe, with LLVM, plus our libGL.so.1, a Vulkan layer that puts pictures in windows, and two
# cubes to try them. Our SDL 2 uses them for SDL_WINDOW_OPENGL and SDL_WINDOW_VULKAN windows.
[mesa]
title = "OpenGL and Vulkan (Mesa)"
category = "System"
debs = ["libosmesa6", "libllvm20", "mesa-vulkan-drivers", "libvulkan1", "libglu1-mesa"]
only = [
    "usr/lib/x86_64-linux-gnu/libOSMesa.so.8.0.0", "usr/lib/x86_64-linux-gnu/libOSMesa.so.8",
    "usr/lib/x86_64-linux-gnu/libLLVM.so.20.1",
    "usr/lib/x86_64-linux-gnu/libvulkan_lvp.so", "usr/share/vulkan/icd.d/lvp_icd.json",
    "usr/lib/x86_64-linux-gnu/libvulkan.so.1.3.275", "usr/lib/x86_64-linux-gnu/libvulkan.so.1",
    "usr/lib/x86_64-linux-gnu/libGLU.so.1.3.1", "usr/lib/x86_64-linux-gnu/libGLU.so.1",
]
script = "mesa/build.sh"
tools = ["libvulkan-dev", "glslang-tools", "spirv-tools"]
run = "/usr/bin/vkcube"
about = "3D graphics for games: OpenGL 4.5 and Vulkan 1.4, drawn by the processor."
icon = "oxygen:preferences-desktop"

